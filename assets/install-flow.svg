<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 250" width="1100" height="250" role="img" aria-label="learning-loop 四步安装流程">
  <rect width="1100" height="250" fill="#f7f4ec"/>
  <text x="40" y="46" font-family="sans-serif" font-size="19" font-weight="700" fill="#16324f">四步上手</text>
  <text x="40" y="72" font-family="sans-serif" font-size="14" fill="#8a8578">把技能文件夹放进用户级技能目录，重启后直接用对话触发</text>

  <g font-family="sans-serif">
    <rect x="40" y="106" width="226" height="104" rx="10" fill="#ffffff" stroke="#d8d0be"/>
    <circle cx="70" cy="138" r="16" fill="#16324f"/>
    <text x="70" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
    <text x="96" y="144" font-size="17" font-weight="700" fill="#16324f">复制技能</text>
    <text x="62" y="178" font-size="13" fill="#5a6673">xcopy / cp 到</text>
    <text x="62" y="198" font-size="13" fill="#5a6673">~/.workbuddy/skills/</text>

    <path d="M274 158 h34" stroke="#c9a961" stroke-width="2.5"/>
    <path d="M308 158 l-9 -6 v12 z" fill="#c9a961"/>

    <rect x="316" y="106" width="226" height="104" rx="10" fill="#ffffff" stroke="#d8d0be"/>
    <circle cx="346" cy="138" r="16" fill="#16324f"/>
    <text x="346" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
    <text x="372" y="144" font-size="17" font-weight="700" fill="#16324f">重启 WorkBuddy</text>
    <text x="338" y="178" font-size="13" fill="#5a6673">让新技能进入</text>
    <text x="338" y="198" font-size="13" fill="#5a6673">加载列表</text>

    <path d="M550 158 h34" stroke="#c9a961" stroke-width="2.5"/>
    <path d="M584 158 l-9 -6 v12 z" fill="#c9a961"/>

    <rect x="592" y="106" width="226" height="104" rx="10" fill="#ffffff" stroke="#d8d0be"/>
    <circle cx="622" cy="138" r="16" fill="#16324f"/>
    <text x="622" y="144" font-size="15" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
    <text x="648" y="144" font-size="17" font-weight="700" fill="#16324f">对话触发</text>
    <text x="614" y="178" font-size="13" fill="#5a6673">「我要学 X」</text>
    <text x="614" y="198" font-size="13" fill="#5a6673">「费曼一下」「我卡住了」</text>

    <path d="M826 158 h34" stroke="#c9a961" stroke-width="2.5"/>
    <path d="M860 158 l-9 -6 v12 z" fill="#c9a961"/>

    <rect x="868" y="106" width="192" height="104" rx="10" fill="#16324f"/>
    <circle cx="898" cy="138" r="16" fill="#c9a961"/>
    <text x="898" y="144" font-size="15" font-weight="700" fill="#16324f" text-anchor="middle">4</text>
    <text x="924" y="144" font-size="17" font-weight="700" fill="#ffffff">卡点落盘</text>
    <text x="890" y="178" font-size="13" fill="#d5e0ec">state/learning.json</text>
    <text x="890" y="198" font-size="13" fill="#d5e0ec">下次续作不丢失</text>
  </g>
</svg>
