<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-label="learning-loop 学习闭环六能力加速器封面">
  <defs>
    <linearGradient id="navy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16324f"/>
      <stop offset="100%" stop-color="#0d2137"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a961"/>
      <stop offset="100%" stop-color="#e3c887"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="#f7f4ec"/>
  <rect x="0" y="0" width="530" height="640" fill="url(#navy)"/>
  <rect x="72" y="118" width="6" height="196" fill="url(#gold)"/>
  <text x="104" y="182" font-family="Arial,Helvetica,sans-serif" font-size="58" font-weight="700" fill="#ffffff">learning-loop</text>
  <text x="104" y="244" font-family="sans-serif" font-size="30" font-weight="600" fill="#e3c887">学习闭环 · 六能力加速器</text>
  <text x="104" y="312" font-family="sans-serif" font-size="19" fill="#d5e0ec">当场懂了、隔周忘了、还以为自己会了？</text>
  <text x="104" y="344" font-family="sans-serif" font-size="19" fill="#d5e0ec">把六个名词变成一套能真跑起来的机制。</text>
  <rect x="104" y="404" width="176" height="42" rx="21" fill="none" stroke="#c9a961" stroke-width="1.5"/>
  <text x="192" y="431" font-family="sans-serif" font-size="16" fill="#e3c887" text-anchor="middle">WorkBuddy Skill</text>
  <rect x="296" y="404" width="130" height="42" rx="21" fill="none" stroke="#7f9bb5" stroke-width="1.5"/>
  <text x="361" y="431" font-family="sans-serif" font-size="16" fill="#d5e0ec" text-anchor="middle">MIT License</text>

  <text x="596" y="92" font-family="sans-serif" font-size="17" font-weight="700" fill="#16324f" letter-spacing="2">THREE LAYERS + ONE FEEDBACK LOOP</text>

  <g font-family="sans-serif">
    <rect x="596" y="118" width="620" height="108" rx="12" fill="#ffffff" stroke="#d8d0be"/>
    <rect x="596" y="118" width="8" height="108" rx="4" fill="#c9a961"/>
    <text x="624" y="154" font-size="21" font-weight="700" fill="#16324f">第一层 · 加速进场</text>
    <text x="624" y="186" font-size="16" fill="#5a6673">① 学习曲线破坏者　④ 个人学习路径</text>
    <text x="624" y="210" font-size="14" fill="#8a8578">跳过铺垫，按卡点动态排程</text>

    <rect x="596" y="248" width="620" height="108" rx="12" fill="#ffffff" stroke="#d8d0be"/>
    <rect x="596" y="248" width="8" height="108" rx="4" fill="#c9a961"/>
    <text x="624" y="284" font-size="21" font-weight="700" fill="#16324f">第二层 · 暴露真实卡点</text>
    <text x="624" y="316" font-size="16" fill="#5a6673">② 真实错误模拟器　③ 困惑破碎机　⑤ 隐藏漏洞检测器</text>
    <text x="624" y="340" font-size="14" fill="#8a8578">把「不会」和「以为会了」都逼出来</text>

    <rect x="596" y="378" width="620" height="108" rx="12" fill="#ffffff" stroke="#d8d0be"/>
    <rect x="596" y="378" width="8" height="108" rx="4" fill="#c9a961"/>
    <text x="624" y="414" font-size="21" font-weight="700" fill="#16324f">第三层 · 输出验证</text>
    <text x="624" y="446" font-size="16" fill="#5a6673">⑥ 强制费曼方法　·　T1~T4 硬通过线</text>
    <text x="624" y="470" font-size="14" fill="#8a8578">禁用术语、不查资料，讲给外行听</text>
  </g>

  <path d="M1216 432 C1258 432 1258 152 1216 152" fill="none" stroke="#c9a961" stroke-width="2.5" stroke-dasharray="7 5"/>
  <path d="M1216 152 l12 -8 l-12 -8 z" fill="#c9a961"/>
  <text x="1098" y="536" font-family="sans-serif" font-size="14" fill="#8a6b2e">回流：讲不下去 → 回写重排下一轮</text>
  <text x="596" y="576" font-family="sans-serif" font-size="14" fill="#8a8578">留存复查 1 / 3 / 7 / 14 天　·　卡点磁盘落盘　·　真实错误不许现编</text>
</svg>
